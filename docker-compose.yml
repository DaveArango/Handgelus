# Oracle Database 23ai Free para desarrollo local (opcional).
# Crea automáticamente el usuario HANDGELUS / handgelus en la PDB FREEPDB1.
#   docker compose up -d
# Luego arranque el backend con:
#   DB_URL=jdbc:oracle:thin:@localhost:1521/FREEPDB1
services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: handgelus-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: handgelus-admin
      APP_USER: HANDGELUS
      APP_USER_PASSWORD: handgelus
    volumes:
      - handgelus-oracle-datos:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  handgelus-oracle-datos:
