# =====================================================================
#  Perfil "h2": base de datos embebida en modo compatible con Oracle.
#  Útil para probar sin tener Oracle instalado.
#  Ejecutar con: ./gradlew :backend:bootRun --args='--spring.profiles.active=h2'
#  En IntelliJ: Run Configuration > Active profiles: h2
# =====================================================================
spring.datasource.url=jdbc:h2:file:./data/handgelus-h2;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
