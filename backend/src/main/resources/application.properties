# =====================================================================
#  HANDGELUS · Configuración principal (perfil por defecto: Oracle)
# =====================================================================
spring.application.name=handgelus
server.port=8080
server.servlet.context-path=/

# ---------------------------------------------------------------------
#  Base de datos Oracle
#  - Oracle XE 21c  -> jdbc:oracle:thin:@localhost:1521/XEPDB1
#  - Oracle 23ai Free -> jdbc:oracle:thin:@localhost:1521/FREEPDB1
#  Cree el usuario con el script: backend/src/main/resources/db/oracle-crear-usuario.sql
#  o levante Oracle con Docker (docker compose up -d) y use DB_URL=...@localhost:1521/FREEPDB1
#  Las variables DB_URL, DB_USUARIO y DB_CLAVE sobrescriben estos valores.
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USUARIO:HANDGELUS}
spring.datasource.password=${DB_CLAVE:handgelus}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=HandgelusPool

# ---------------------------------------------------------------------
#  JPA / Hibernate
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# ---------------------------------------------------------------------
#  Carga de archivos (imagen de referencia máx. 5 MB · RF-02)
# ---------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
handgelus.almacenamiento.directorio=./uploads

# ---------------------------------------------------------------------
#  Seguridad · JWT y HTTPS (RNF-06 / SWR-03)
#  Para habilitar HTTPS genere un keystore:
#    keytool -genkeypair -alias handgelus -keyalg RSA -keysize 2048 -storetype PKCS12 \
#            -keystore backend/src/main/resources/handgelus.p12 -validity 3650
#  y descomente las líneas server.ssl.* además de poner requerir-https=true.
# ---------------------------------------------------------------------
handgelus.jwt.secreto=Handgelus-Atelier-Secreto-JWT-Cambiar-En-Produccion-2026!
handgelus.jwt.expiracion-horas=12
handgelus.seguridad.requerir-https=false
handgelus.cors.origenes-permitidos=http://localhost:4200
#server.ssl.enabled=true
#server.ssl.key-store=classpath:handgelus.p12
#server.ssl.key-store-password=cambiar
#server.ssl.key-store-type=PKCS12
#server.ssl.key-alias=handgelus

# ---------------------------------------------------------------------
#  Reglas de negocio parametrizables
# ---------------------------------------------------------------------
# RN-02: abono mínimo de tatuaje (%)
handgelus.negocio.porcentaje-abono-tatuaje=30
# RN-10: anticipo de comisión (%)
handgelus.negocio.porcentaje-anticipo-comision=50
# RF-09: horas para confirmar un pago antes de revertir el estado
handgelus.negocio.horas-expiracion-pago=48
# CU-02 4.a: horas sin confirmar cotización antes de alertar
handgelus.negocio.horas-alerta-cotizacion=72
# RF-10: citas máximas por día y por tatuador
handgelus.negocio.max-citas-por-dia=2
# RF-02: tamaño máximo de la imagen de referencia (bytes)
handgelus.negocio.imagen-max-bytes=5242880
# RN-09: costo de envío de obras por comisión (COP)
handgelus.negocio.ciudad-local=Armenia
handgelus.negocio.costo-envio-local=12000
handgelus.negocio.costo-envio-nacional=28000
# RN-04: horas por sesión de tatuaje
handgelus.negocio.horas-por-sesion=4

# ---------------------------------------------------------------------
#  Integraciones simuladas
# ---------------------------------------------------------------------
# Pasarela de pago simulada (MercadoPago/PayU). La firma protege el webhook.
handgelus.pasarela.nombre=Pasarela Handgelus (simulada)
handgelus.pasarela.firma-webhook=hg-webhook-firma-local
handgelus.pasarela.url-checkout=http://localhost:4200/pasarela
# Pantalla de pasarela simulada (/api/pasarela-simulada/**). Poner en false al integrar una pasarela real.
handgelus.pasarela.simulada-habilitada=true
# Correo transaccional simulado (se registra en BD y en el log)
handgelus.correo.remitente=atelier@handgelus.co

# ---------------------------------------------------------------------
#  Tareas programadas
# ---------------------------------------------------------------------
# Revisión de pagos vencidos y cotizaciones sin confirmar (cada 10 minutos)
handgelus.tareas.intervalo-ms=600000

# ---------------------------------------------------------------------
#  Datos iniciales de demostración
# ---------------------------------------------------------------------
handgelus.datos-iniciales.habilitado=true

# ---------------------------------------------------------------------
#  Logging
# ---------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.handgelus=DEBUG
logging.level.org.hibernate.SQL=WARN
